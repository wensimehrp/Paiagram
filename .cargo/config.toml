[target.wasm32-unknown-unknown]
rustflags = [
  "--cfg=getrandom_backend=\"wasm_js\"",
  "--cfg=web_sys_unstable_apis",  # for query_local_fonts
  "-Ctarget-feature=+simd128,+atomics,+bulk-memory,+mutable-globals",
  # rquickjs-sys ships a prebuilt wasi-libc/libc.a compiled without atomics.
  # Rebuilding libc.a with -matomics -mbulk-memory would
  # let this workaround be dropped.
  "-Clink-arg=--no-check-features",
  "-Clink-arg=--shared-memory",
  "-Clink-arg=--max-memory=1073741824",
  "-Clink-arg=--import-memory",
  "-Clink-arg=--export=__wasm_init_tls",
  "-Clink-arg=--export=__tls_size",
  "-Clink-arg=--export=__tls_align",
  "-Clink-arg=--export=__tls_base",
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-Clink-arg=-fuse-ld=mold",  # use the mold linker
  "-Clink-arg=-Wl,-z,pack-relative-relocs",  # use RT_RELR
  # Remove unreferenced sections, see
  # https://github.com/rui314/mold/blob/d04c073d0aca43a553e45cb802ae2064775c5a21/docs/mold.md?plain=1#L622-L623
  "-Clink-arg=-Wl,--gc-sections",
  # Identical code folding, see
  # https://github.com/rui314/mold/blob/d04c073d0aca43a553e45cb802ae2064775c5a21/docs/mold.md?plain=1#L634-L662
  "-Clink-arg=-Wl,--icf=all",
]

[unstable]
build-std = ["std", "panic_abort"]
