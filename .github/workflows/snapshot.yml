name: Build snapshot and push to archive

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.*"
      - "flake.*"
      - "crates/**"
      - ".cargo/**"
      - "web/nightly/**"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

concurrency:
  group: wasm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          key: ${{ hashFiles('flake.lock') }}

      - name: Download Sarasa fonts
        run: nix develop .#default --command just download-font

      - name: Prepare Pages artifact
        run: nix develop .#default --command just build-release-wasm-app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pages
          path: ./dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: wensimehrp/Paiagram-archive
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          publish_branch: main
          publish_dir: ./dist
          destination_dir: new-snapshot
