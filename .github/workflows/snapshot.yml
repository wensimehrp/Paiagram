name: Build snapshot and push to archive

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.*"
      - "flake.*"
      - "crates/**"
      - ".cargo/**"
      - ".github/workflows/snapshot.yml"
  workflow_dispatch:

concurrency:
  group: wasm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          key: ${{ hashFiles('flake.lock') }}

      - name: Download Sarasa fonts
        run: nix develop .#default --command just download-font

      - name: Prepare Pages artifact
        run: nix develop .#default --command just build-release-wasm-app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pages
          path: ./dist

      - name: Deploy
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          REPOSITORY: wensimehrp/Paiagram-archive
          BRANCH: main
          SOURCE_DIR: ./dist
          TARGET_DIR: new-snapshot
        run: ./.github/scripts/deploy-dir.sh
