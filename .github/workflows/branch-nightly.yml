name: Nightly Build & Pages Deploy

on:
  push:
    branches-ignore:
      - main
    paths:
      - "Cargo.*"
      - "flake.*"
      - "crates/**"
      - ".cargo/**"
      - "web/nightly/**"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-wasm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2

      - name: Prepare Pages artifact
        run: nix develop .#default --command just release-wasm-app

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pages
          path: ./dist/app

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: WenSimEHRP/Paiagram-Archive
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          publish_branch: main
          publish_dir: ./dist/app
          destination_dir: ${{ github.ref_name }}-preview
