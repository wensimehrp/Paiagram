name: Build Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Compile site
        run: nix develop .#default --command ./site.typ compile

      - name: Deploy
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          REPOSITORY: wensimehrp/Paiagram-archive
          BRANCH: main
          SOURCE_DIR: ./site
          TARGET_DIR: site
        run: ./.github/scripts/deploy-dir.sh
