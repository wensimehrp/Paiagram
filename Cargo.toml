[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/paiagram"]

[workspace.package]
version = "0.1.3"
edition = "2024"
description = "Web/desktop timetabling application"
documentation = "https://paiagram.com/docs"
readme = "README.md"
homepage = "https://paiagram.com"
repository = "https://github.com/wensimehrp/paiagram"
license = "MPL-2.0"
keywords = ["diagram", "scheduler", "timetabling", "web"]
categories = ["visualization"]

[workspace.dependencies]
bitflags = "2.13.2"
# WGSL data communication
bytemuck = { version = "1.23.2", features = ["extern_crate_alloc"] }
cbor4ii = { version = "1.2.2", features = ["serde1", "use_alloc", "use_std"] }
# CLI
clap = { version = "4.5.51", features = ["derive"] }
csv = "1.4.0"
# Interesting string
ecow = { version = "0.3.1", features = ["serde"] }
# egui stuff
eframe = {
  version = "0.37.0",
  default-features = false,
  features = [
    "accesskit",
    "clipboard",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
  ],
}
egui = {
  version = "0.37.0",
  features = [
    "persistence",
    "rayon",
    "serde",
  ]
}
egui_extras = {
  version = "0.37.0",
  features = ["syntect"],
}
# Internationalization
egui-i18n = { version = "0.2.0", features = ["fluent"] }
egui_tiles = "0.18.0"
ehttp = "0.7.1"
either = "1.15.0"
encoding_rs = "0.8.35"
env_logger = "0.11.11"
fdg-sim = "0.9.1"
fontdb = "0.24.0"
futures-channel = "0.3"
git-version = "0.3.9"
gtfs-structures = { version = "0.50.1", default-features = false }
ib-matcher = { version = "0.4.3", features = ["pinyin", "romaji"] }
idb = "0.6.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
imbl = { version = "7.0.2", features = ["debug", "serde"] }
itertools = "0.14.0"
jiff = "0.2.29"
js-sys = "0.3"
krilla = "0.8.2"
log = "0.4.34"
paiagram-core.path = "crates/paiagram-core"
paiagram-export.path = "crates/paiagram-export"
paiagram-extensions.path = "crates/paiagram-extensions"
paiagram-oudia.path = "crates/paiagram-oudia"
paiagram-oudia-macros.path = "crates/paiagram-oudia-macros"
paiagram-rw.path = "crates/paiagram-rw"
paiagram-selection.path = "crates/paiagram-selection"
parking_lot = "0.12"
paste = "1.0.15"
petgraph = { version = "0.8.3", features = ["rayon", "serde-1"] }
pollster = "1.0.1"
# latest puffin to support egui 0.37
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "39c8970abd6a95871bcaf0d3581c494885f2edd5", features = ["web"] }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "39c8970abd6a95871bcaf0d3581c494885f2edd5" }
raptor = {
  git = "https://github.com/keogami/raptor-rs",
  rev = "5fd28ead608ce81ab787df04166c65ce8d9b1e1e",
}
rayon = "1.12.0"
rfd = "0.17.2"
ron = "0.12.0"
rquickjs = { version = "0.14.0", features = ["macro", "parallel", "rust-alloc"] }
rquickjs-serde = { git = "https://github.com/wensimehrp/rquickjs-serde.git", branch = "bigint" }
rstar = "0.12.2"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.145"
smallvec = { version = "1.15.1", features = ["serde"] }
thiserror = "2.0.18"
urlencoding = "2.1.3"
vec1 = "1.12.1"
walkers = { version = "0.63.0", features = ["serde"] }
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
web-sys = {
  version = "0.3.104",
  features = [
    "Blob",
    "Clipboard",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FontData",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Url",
    "Window",
  ]
}
web-time = "1.1.0"
wesl = "0.5.0"
wgsl_bindgen = "0.23"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zrip = "0.8.7"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 2

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
opt-level = 2
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

# Profile for converter. For some reason the converter requires strip to be debuginfo
[profile.converter]
inherits = "release"
strip = "debuginfo"
